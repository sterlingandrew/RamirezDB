<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New sample · RamirezDB</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="shell-header"></header>
<main class="page">
  <h1>New sample</h1>

  <form id="new-sample" class="card" novalidate>
    <div class="field">
      <label for="stssn">STSSN <span class="req">required</span></label>
      <input class="input" id="stssn" name="stssn" maxlength="25" required>
      <p class="hint">Format: initials, date, sequence — e.g. ABC20240612-01.</p>
    </div>
    <div class="field">
      <label for="strand_date">Strand date <span class="req">required</span></label>
      <input class="input" id="strand_date" name="strand_date" type="date" required>
    </div>
    <div class="field">
      <label for="species">Species</label>
      <select class="input" id="species" name="species">
        <option value="cc">Loggerhead</option>
        <option value="cm">Green</option>
        <option value="dc">Leatherback</option>
        <option value="ei">Hawksbill</option>
        <option value="lk">Kemp's ridley</option>
        <option value="u">Unknown</option>
      </select>
    </div>
    <div class="field">
      <label for="sex">Sex</label>
      <select class="input" id="sex" name="sex">
        <option value="u">Unknown</option>
        <option value="f">Female</option>
        <option value="m">Male</option>
      </select>
    </div>
    <div class="field">
      <label for="state">State</label>
      <input class="input" id="state" name="state" maxlength="2">
    </div>
    <div class="field">
      <label for="strand_scl">Straight carapace length (cm)</label>
      <input class="input" id="strand_scl" name="strand_scl" type="number" step="0.1" inputmode="decimal">
    </div>
    <div class="field">
      <label for="collaborator">Collaborator</label>
      <input class="input" id="collaborator" name="collaborator" maxlength="255">
    </div>
    <p class="error" id="form-error" hidden></p>
    <div class="row">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-ghost" href="samples.html">Cancel</a>
    </div>
  </form>
</main>
<script type="module" src="js/pages/new-sample.js"></script>
</body>
</html>
