<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · RamirezDB</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header id="shell-header"></header>
<main class="page">
  <h1>Administration</h1>

  <section class="card">
    <h2>Members</h2>
    <p class="hint">Roles are set here and nowhere else. A member cannot change their own role.</p>
    <p class="status" id="status" role="status">Loading…</p>
    <table class="table" id="members" hidden>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Recent changes</h2>
    <table class="table" id="audit">
      <thead><tr><th>When</th><th>Operation</th><th>Sample</th><th>By</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script type="module" src="js/pages/admin.js"></script>
</body>
</html>
